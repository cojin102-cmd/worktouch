<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무바톤터치</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem("worktouch:theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 17 14 7"/><path d="M14 7h-5"/><path d="M14 7v5"/>
          <circle cx="4" cy="17" r="2.2" fill="#fff" stroke="none"/>
          <circle cx="18" cy="6" r="2.2" fill="#fff" stroke="none"/>
        </svg>
      </div>
      <div class="brand-name">업무바톤터치</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item is-active" data-view="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
        </svg>
        <span>대시보드</span>
      </button>
      <button class="nav-item" data-view="handover">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><path d="M9 13h6"/><path d="M9 17h4"/>
        </svg>
        <span>인수인계 작성</span>
      </button>
      <button class="nav-item" data-view="docbox">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h3.5l1.5 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        </svg>
        <span>문서함</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggleBtn" type="button">
        <span class="theme-toggle-icon">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </span>
        <span class="theme-label">다크 모드</span>
      </button>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <main class="main">

    <!-- 1. 대시보드 -->
    <section class="view" id="view-dashboard">
      <div class="dashboard-greeting">
        <div class="greeting-text">
          안녕하세요,
          <input type="text" id="userNameInput" class="user-name-input" placeholder="이름을 입력하세요" maxlength="20">
          님
        </div>
        <div class="greeting-sub">오늘의 업무 현황을 확인하세요</div>
      </div>

      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-card-head">
            <div class="stat-label">전체 업무</div>
            <div class="stat-icon-chip chip-neutral">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
            </div>
          </div>
          <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-head">
            <div class="stat-label">진행중</div>
            <div class="stat-icon-chip chip-blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
            </div>
          </div>
          <div class="stat-value stat-blue" id="statInProgress">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-head">
            <div class="stat-label">완료</div>
            <div class="stat-icon-chip chip-gray">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
          </div>
          <div class="stat-value stat-gray" id="statDone">0</div>
        </div>
        <div class="stat-card stat-card-danger">
          <div class="stat-card-head">
            <div class="stat-label stat-label-danger">기한임박</div>
            <div class="stat-icon-chip chip-danger">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 17h.01"/></svg>
            </div>
          </div>
          <div class="stat-value stat-danger" id="statDueSoon">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-head">
            <div class="stat-label">완료율</div>
            <div class="stat-icon-chip chip-success">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
            </div>
          </div>
          <div class="stat-value stat-success" id="statCompletionRate">0%</div>
        </div>
      </div>

      <div class="dashboard-lower">
        <div class="panel">
          <div class="panel-title">최근 인수인계 문서</div>
          <div class="list" id="recentDocList"></div>
        </div>
        <div class="panel">
          <div class="panel-title">마감 임박 업무</div>
          <div class="list" id="dueSoonList"></div>
        </div>
      </div>
    </section>

    <!-- 2. 인수인계 작성 -->
    <section class="view" id="view-handover" hidden>
      <div class="view-title">인수인계 작성</div>

      <div class="steps">
        <div class="step" data-step="1">
          <div class="step-dot">1</div>
          <div class="step-label">기본정보</div>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="2">
          <div class="step-dot">2</div>
          <div class="step-label">업무내용</div>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="3">
          <div class="step-dot">3</div>
          <div class="step-label">확인</div>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="4">
          <div class="step-dot">4</div>
          <div class="step-label">저장</div>
        </div>
      </div>

      <!-- Step 1 -->
      <div class="form-card step-panel" id="step-1">
        <div class="field">
          <label>업무명</label>
          <input type="text" id="docTitleInput" placeholder="예) 2026년 민원처리 인수인계서">
        </div>
        <div class="field-row">
          <div class="field">
            <label>인계자</label>
            <input type="text" id="docFromInput" placeholder="담당자 이름">
          </div>
          <div class="field">
            <label>인수자</label>
            <input type="text" id="docToInput" placeholder="담당자 이름">
          </div>
        </div>
        <div class="field field-narrow">
          <label>작성일</label>
          <input type="date" id="docDateInput">
        </div>
      </div>

      <!-- Step 2 -->
      <div class="form-card step-panel" id="step-2" hidden>
        <div class="task-table-head">
          <div class="panel-title">업무 내용</div>
          <button class="btn btn-outline btn-small" id="addTaskBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            업무 추가
          </button>
        </div>
        <div class="task-table" id="taskTable"></div>
      </div>

      <!-- Step 3 -->
      <div class="form-card step-panel" id="step-3" hidden>
        <div class="review-meta" id="reviewMeta"></div>
        <div class="panel-title">업무 내용</div>
        <div class="task-table task-table-readonly" id="reviewTaskTable"></div>
      </div>

      <!-- Step 4 -->
      <div class="form-card step-panel step-done" id="step-4" hidden>
        <div class="done-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div class="done-title">인수인계서가 저장되었습니다</div>
        <div class="done-sub">문서함에서 저장된 문서를 확인할 수 있습니다</div>
        <button class="btn btn-primary" id="goToDocboxBtn">문서함으로 이동</button>
      </div>

      <div class="wizard-actions">
        <button class="btn btn-outline btn-small" id="exportDraftBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Excel로 저장
        </button>
        <div class="wizard-actions-right">
          <button class="btn btn-ghost" id="prevStepBtn">이전</button>
          <button class="btn btn-primary" id="nextStepBtn">다음</button>
        </div>
      </div>
    </section>

    <!-- 3. 문서함 -->
    <section class="view" id="view-docbox" hidden>
      <div class="docbox">
        <div class="doc-list-panel">
          <div class="doc-list-head">
            <div class="panel-title">문서함</div>
            <button class="btn btn-outline btn-small" id="importExcelBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
              Excel 불러오기
            </button>
          </div>
          <input type="text" id="docSearchInput" class="doc-search" placeholder="업무명 검색">
          <div class="doc-list" id="docList"></div>
        </div>
        <div class="doc-detail-panel" id="docDetail">
          <div class="empty-state">왼쪽에서 문서를 선택하세요</div>
        </div>
      </div>
    </section>

  </main>
</div>

<input type="file" id="excelFileInput" accept=".xlsx,.xls" hidden>

<script src="lib/xlsx.full.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
